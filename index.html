<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Khám Phá Hệ Mặt Trời</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --glow-sun: #ff6b00;
                --glow-blue: #00cfff;
                --star-color: #ffffff;
                --bg: #000008;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                -webkit-tap-highlight-color: transparent;
            }

            body {
                background: var(--bg);
                overflow: hidden;
                font-family: "Exo 2", sans-serif;
                cursor: crosshair;
                height: 100vh;
                width: 100vw;
            }

            /* ── STARS ── */
            #stars-canvas {
                position: fixed;
                inset: 0;
                z-index: 0;
            }

            /* ── SOLAR SYSTEM ── */
            #solar-system {
                position: fixed;
                inset: 0;
                z-index: 1;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            body,
            #solar-system {
                touch-action: none; /* Bắt buộc: Ngăn trình duyệt di động chiếm quyền zoom/cuộn mặc định */
                -webkit-user-select: none;
                user-select: none;
            }

            .system-center {
                position: relative;
                width: 0;
                height: 0;
                transition: transform 0.08s ease-out;
            }

            /* ── ORBITS ── */
            .orbit {
                position: absolute;
                border-radius: 50%;
                border: 1px solid rgba(255, 255, 255, 0.08);
                transform: translate(-50%, -50%);
                animation: orbit-spin linear infinite;
                pointer-events: none;
            }
            .orbit::before {
                content: "";
                position: absolute;
                inset: -1px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    rgba(0, 207, 255, 0.04) 0%,
                    transparent 70%
                );
            }

            @keyframes orbit-spin {
                from {
                    transform: translate(-50%, -50%) rotate(0deg);
                }
                to {
                    transform: translate(-50%, -50%) rotate(360deg);
                }
            }

            /* ── PLANET WRAPPER ── */
            .planet-wrapper {
                position: absolute;
                top: 0;
                left: 50%;
                transform-origin: 0 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                pointer-events: auto;
                cursor: pointer;
                animation: counter-spin linear infinite;
            }

            /* Vùng đệm cảm ứng vô hình (Hitbox) cho ngón tay trên điện thoại */
            .planet-wrapper::before {
                content: "";
                position: absolute;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 44px;
                height: 44px;
                z-index: 10;
            }

            @keyframes counter-spin {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(-360deg);
                }
            }

            .planet {
                border-radius: 50%;
                position: relative;
                transition:
                    transform 0.2s ease,
                    filter 0.2s ease;
                flex-shrink: 0;
            }
            .planet:hover,
            .planet:active {
                transform: scale(1.25);
                filter: brightness(1.4) drop-shadow(0 0 18px currentColor);
            }

            .planet::after {
                content: "";
                position: absolute;
                inset: -4px;
                border-radius: 50%;
                opacity: 0.4;
                animation: planet-pulse 3s ease-in-out infinite;
            }
            @keyframes planet-pulse {
                0%,
                100% {
                    transform: scale(1);
                    opacity: 0.4;
                }
                50% {
                    transform: scale(1.15);
                    opacity: 0.1;
                }
            }

            .planet-label {
                font-family: "Orbitron", monospace;
                font-size: 8px;
                letter-spacing: 1.5px;
                text-transform: uppercase;
                color: rgba(255, 255, 255, 0.7);
                white-space: nowrap;
                pointer-events: none;
                text-shadow: 0 0 8px rgba(0, 207, 255, 0.8);
            }

            /* ── SUN ── */
            #sun {
                position: absolute;
                width: 70px;
                height: 70px;
                border-radius: 50%;
                background: radial-gradient(
                    circle at 35% 35%,
                    #fff7aa,
                    #ffcc00 30%,
                    #ff8800 60%,
                    #cc3300
                );
                box-shadow:
                    0 0 30px 15px rgba(255, 140, 0, 0.6),
                    0 0 60px 30px rgba(255, 80, 0, 0.3);
                transform: translate(-50%, -50%);
                animation: sun-pulse 4s ease-in-out infinite;
                cursor: pointer;
                z-index: 5;
            }
            #sun::before {
                content: "";
                position: absolute;
                inset: -10px;
                border-radius: 50%;
                background: radial-gradient(
                    circle,
                    rgba(255, 200, 0, 0.2),
                    transparent 70%
                );
                animation: sun-flare 6s linear infinite;
            }
            @keyframes sun-pulse {
                0%,
                100% {
                    box-shadow:
                        0 0 30px 15px rgba(255, 140, 0, 0.6),
                        0 0 60px 30px rgba(255, 80, 0, 0.3);
                }
                50% {
                    box-shadow:
                        0 0 50px 25px rgba(255, 160, 0, 0.8),
                        0 0 90px 45px rgba(255, 100, 0, 0.4);
                }
            }
            @keyframes sun-flare {
                from {
                    transform: rotate(0deg);
                }
                to {
                    transform: rotate(360deg);
                }
            }
            #sun-label {
                position: absolute;
                top: 48px;
                left: 50%;
                transform: translateX(-50%);
                font-family: "Orbitron", monospace;
                font-size: 8px;
                letter-spacing: 2px;
                color: #ffcc00;
                text-shadow: 0 0 12px #ff8800;
                white-space: nowrap;
                pointer-events: none;
            }

            /* ── SATURN RING ── */
            .saturn-ring {
                position: absolute;
                border-radius: 50%;
                border: 2.5px solid rgba(210, 180, 120, 0.7);
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%) rotateX(70deg);
                pointer-events: none;
                box-shadow: 0 0 6px rgba(210, 180, 120, 0.3);
            }

            /* ── TOOLTIP ── */
            #tooltip {
                position: fixed;
                background: linear-gradient(
                    135deg,
                    rgba(0, 10, 30, 0.96),
                    rgba(0, 30, 60, 0.96)
                );
                border: 1px solid rgba(0, 207, 255, 0.4);
                border-radius: 14px;
                padding: 16px 20px;
                max-width: 300px;
                z-index: 1000;
                pointer-events: none;
                opacity: 0;
                transform: scale(0.8) translateY(10px);
                transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
                backdrop-filter: blur(20px);
                box-shadow: 0 0 30px rgba(0, 207, 255, 0.15);
            }
            #tooltip.show {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
            .tooltip-title {
                font-family: "Orbitron", monospace;
                font-size: 15px;
                font-weight: 900;
                color: var(--glow-blue);
                margin-bottom: 6px;
            }
            .tooltip-fact {
                font-size: 11px;
                color: rgba(200, 230, 255, 0.85);
                line-height: 1.5;
                margin-bottom: 8px;
            }
            .tooltip-troll {
                font-size: 12px;
                font-weight: 600;
                color: #ff4d6d;
                border-top: 1px solid rgba(255, 77, 109, 0.2);
                padding-top: 8px;
                line-height: 1.4;
            }

            /* ── MODAL ── */
            #modal-overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 20, 0.85);
                z-index: 900;
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s;
                backdrop-filter: blur(6px);
                padding: 16px;
            }
            #modal-overlay.show {
                opacity: 1;
                pointer-events: all;
            }
            #modal-box {
                background: linear-gradient(160deg, #000c24, #001a3a);
                border: 1px solid rgba(0, 207, 255, 0.3);
                border-radius: 20px;
                padding: 24px;
                max-width: 440px;
                max-height: 90vh;
                overflow-y: auto;
                width: 100%;
                text-align: center;
                transform: scale(0.85);
                transition: transform 0.3s ease;
                box-shadow: 0 0 50px rgba(0, 207, 255, 0.15);
                position: relative;
            }
            #modal-overlay.show #modal-box {
                transform: scale(1);
            }

            .modal-planet-icon {
                font-size: 48px;
                margin-bottom: 8px;
                display: block;
            }
            .modal-planet-name {
                font-family: "Orbitron", monospace;
                font-size: 20px;
                font-weight: 900;
                color: #ffffff;
                text-shadow: 0 0 15px var(--glow-blue);
                letter-spacing: 2px;
                margin-bottom: 10px;
            }
            .modal-fact {
                font-size: 12px;
                color: rgba(180, 220, 255, 0.85);
                line-height: 1.6;
                margin-bottom: 16px;
            }
            .modal-troll-box {
                background: linear-gradient(
                    135deg,
                    rgba(255, 30, 80, 0.12),
                    rgba(255, 100, 0, 0.08)
                );
                border: 1px solid rgba(255, 60, 90, 0.35);
                border-radius: 12px;
                padding: 12px 16px;
                margin-bottom: 16px;
            }
            .modal-troll-title {
                font-family: "Orbitron", monospace;
                font-size: 10px;
                letter-spacing: 1.5px;
                color: #ff6b6b;
                margin-bottom: 6px;
            }
            .modal-troll-text {
                font-size: 13px;
                font-weight: 600;
                color: #ff4d6d;
                line-height: 1.4;
            }
            .modal-iq {
                font-family: "Orbitron", monospace;
                font-size: 11px;
                color: #ffd700;
                letter-spacing: 1.5px;
                margin-bottom: 16px;
                font-weight: bold;
            }
            #modal-close {
                background: linear-gradient(135deg, #0066cc, #0044aa);
                border: none;
                color: white;
                font-family: "Orbitron", monospace;
                font-size: 11px;
                letter-spacing: 2px;
                padding: 10px 24px;
                border-radius: 50px;
                cursor: pointer;
            }

            /* ── HEADER ── */
            #header {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                z-index: 10;
                padding: 14px 20px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: linear-gradient(
                    to bottom,
                    rgba(0, 0, 20, 0.9),
                    transparent
                );
                pointer-events: none;
            }
            .header-title {
                font-family: "Orbitron", monospace;
                font-size: 15px;
                font-weight: 900;
                color: white;
                letter-spacing: 2px;
            }
            .header-title span {
                color: var(--glow-blue);
            }
            .header-hint {
                font-size: 10px;
                color: rgba(255, 255, 255, 0.5);
                letter-spacing: 1px;
            }

            /* ── PARTICLES & FX ── */
            .particle {
                position: fixed;
                width: 4px;
                height: 4px;
                border-radius: 50%;
                pointer-events: none;
                z-index: 999;
                animation: particle-fly 0.8s ease-out forwards;
            }
            @keyframes particle-fly {
                0% {
                    opacity: 1;
                    transform: translate(0, 0) scale(1);
                }
                100% {
                    opacity: 0;
                    transform: translate(var(--tx), var(--ty)) scale(0);
                }
            }

            #nebula {
                position: fixed;
                inset: 0;
                z-index: 0;
                background:
                    radial-gradient(
                        ellipse 60% 40% at 20% 50%,
                        rgba(20, 0, 60, 0.5) 0%,
                        transparent 70%
                    ),
                    radial-gradient(
                        ellipse 40% 60% at 80% 30%,
                        rgba(0, 20, 60, 0.4) 0%,
                        transparent 70%
                    );
                pointer-events: none;
            }

            /* ── THÔNG BÁO XOAY MÀN HÌNH ── */
            #rotate-device-hint {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(5, 8, 22, 0.98);
                backdrop-filter: blur(10px);
                z-index: 99999;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: #ffffff;
                text-align: center;
                padding: 24px;
            }
            .hint-icon {
                font-size: 44px;
                margin-bottom: 14px;
                animation: rotatePhone 2s infinite ease-in-out;
            }
            @keyframes rotatePhone {
                0%,
                100% {
                    transform: rotate(0deg);
                }
                50% {
                    transform: rotate(-90deg);
                }
            }

            /* Tối ưu riêng cho chế độ xoay ngang trên Mobile (Landscape) */
            @media screen and (max-height: 500px) {
                #header {
                    padding: 8px 16px;
                }
                .header-title {
                    font-size: 12px;
                }
                .header-hint {
                    display: none;
                }
                #sun {
                    width: 44px;
                    height: 44px;
                }
                #sun-label {
                    top: 32px;
                    font-size: 7px;
                }
                #modal-box {
                    padding: 14px 20px;
                }
                .modal-planet-icon {
                    font-size: 32px;
                    margin-bottom: 4px;
                }
                .modal-planet-name {
                    font-size: 16px;
                    margin-bottom: 6px;
                }
                .modal-fact {
                    font-size: 11px;
                    margin-bottom: 8px;
                }
                .modal-troll-box {
                    padding: 8px 12px;
                    margin-bottom: 8px;
                }
                .modal-troll-text {
                    font-size: 12px;
                }
            }

            /* Màn hình dưới 900px cầm dọc -> Bắt xoay ngang */
            @media screen and (max-width: 900px) and (orientation: portrait) {
                #rotate-device-hint {
                    display: flex;
                }
            }
        </style>
    </head>
    <body>
        <div id="rotate-device-hint">
            <div class="hint-icon">📱 ➔ 📲</div>
            <h3
                style="
                    font-family: &quot;Orbitron&quot;;
                    margin-bottom: 8px;
                    font-size: 16px;
                    color: var(--glow-blue);
                "
            >
                XOAY NGANG ĐIỆN THOẠI
            </h3>
            <p
                style="
                    font-size: 13px;
                    color: #a0aec0;
                    max-width: 280px;
                    line-height: 1.5;
                "
            >
                Vui lòng xoay ngang màn hình để trải nghiệm trọn vẹn toàn bộ các
                quỹ đạo hành tinh!
            </p>
        </div>

        <div id="nebula"></div>
        <canvas id="stars-canvas"></canvas>

        <div id="header">
            <div class="header-title">HỆ <span>MẶT TRỜI</span></div>
            <div class="header-hint">⚡ CHẠM VÀO HÀNH TINH ⚡</div>
        </div>

        <div id="solar-system">
            <div class="system-center" id="system-center">
                <div id="sun">
                    <div id="sun-label">MẶT TRỜI</div>
                </div>
            </div>
        </div>

        <!-- Tooltip (Dành riêng cho máy tính có chuột) -->
        <div id="tooltip">
            <div class="tooltip-title" id="tt-title"></div>
            <div class="tooltip-fact" id="tt-fact"></div>
            <div class="tooltip-troll">
                <span id="tt-troll"></span>
            </div>
        </div>

        <!-- Modal (Click / Touch) -->
        <div id="modal-overlay">
            <div id="modal-box">
                <span class="modal-planet-icon" id="m-icon"></span>
                <div class="modal-planet-name" id="m-name"></div>

                <div class="modal-troll-box">
                    <div class="modal-troll-title">
                        🛸 KẾT QUẢ PHÂN TÍCH VÔ TRI

                    <div class="modal-troll-text" id="m-troll"></div>
                </div>
                <div class="modal-iq" id="m-iq"></div>
                <button id="modal-close">ĐÓNG LẠI</button>
            </div>
        </div>

                {
                    name: "NEPTUNE",
                    viet: "Sao Hải Vương",
                    emoji: "🔷",
                    color: "#3355ff",
                    glow: "#4466ff",
                    size: 22,
                    orbitR: 435,
                    speed: 115,
                    fact: "Có gió mạnh nhất hệ mặt trời, đạt 2.100 km/h. Chưa ai đặt chân đến đây.",
                    hoverTroll:
                        "Xa nhất, lạnh nhất — mô tả chính xác mức độ warm IQ của bạn 🧊",
                    troll: "Sao Hải Vương cách Trái Đất 4.5 tỷ km. Tàu Voyager 2 mất 12 năm để đến đó. Thông tin hữu ích hơn nhiều so với việc bạn vừa click vào đây. 🌊🚀",
                    iq: "[ IQ ĐO ĐƯỢC: 4.5 tỷ km từ bình thường ]",
                },
            ];

            // ─── KIỂM TRA THIẾT BỊ CẢM ỨNG ───
            const isTouch =
                "ontouchstart" in window || navigator.maxTouchPoints > 0;

            // ─── STARS CANVAS ───
            const canvas = document.getElementById("stars-canvas");
            const ctx = canvas.getContext("2d");
            let stars = [];

            function resizeCanvas() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }

            function buildStars() {
                stars = [];
                const n = Math.floor((canvas.width * canvas.height) / 2600);
                for (let i = 0; i < n; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        r: Math.random() * 1.3 + 0.2,
                        alpha: Math.random() * 0.7 + 0.2,
                        dAlpha: (Math.random() - 0.5) * 0.01,
                    });
                }
            }

            function drawStars() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach((s) => {
                    s.alpha += s.dAlpha;
                    if (s.alpha > 0.9 || s.alpha < 0.1) s.dAlpha *= -1;
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
                    ctx.fill();
                });
                requestAnimationFrame(drawStars);
            }

            // ─── BUILD PLANETS (HỖ TRỢ REBUILD TỰ ĐỘNG KHI XOAY MÀN HÌNH) ───
            const center = document.getElementById("system-center");

            function getScale() {
                // Giới hạn tỉ lệ dựa theo cạnh bé nhất để không văng ra ngoài khung nhìn
                const minEdge = Math.min(window.innerWidth, window.innerHeight);
                return (minEdge * 0.45) / 415;
            }

            function renderSolarSystem() {
                // Xóa các orbit cũ (giữ lại #sun)
                const oldOrbits = center.querySelectorAll(".orbit");
                oldOrbits.forEach((el) => el.remove());

                const sc = getScale();

                planets.forEach((p, i) => {
                    const r = p.orbitR * sc;
                    const pSize = Math.max(p.size * sc * 1.3, 8); // Tối thiểu 8px hiển thị

                    const orbit = document.createElement("div");
                    orbit.className = "orbit";
                    orbit.style.cssText = `
                        width:${r * 2}px; height:${r * 2}px;
                        animation-duration:${p.speed}s;
                    `;
                    center.appendChild(orbit);

                    const wrapper = document.createElement("div");
                    wrapper.className = "planet-wrapper";
                    wrapper.style.cssText = `
                        top: -${r}px;
                        animation-duration:${p.speed}s;
                    `;

                    const planet = document.createElement("div");
                    planet.className = "planet";
                    planet.style.cssText = `
                        width:${pSize}px; height:${pSize}px;
                        background: radial-gradient(circle at 35% 30%, ${lighten(p.color)}, ${p.color} 55%, ${darken(p.color)});
                        box-shadow: 0 0 ${pSize}px ${pSize / 2}px ${p.color}44;
                        color: ${p.glow};
                    `;

                    if (p.hasRing) {
                        const ring = document.createElement("div");
                        ring.className = "saturn-ring";
                        ring.style.width = `${pSize * 2.2}px`;
                        ring.style.height = `${pSize * 0.5}px`;
                        planet.appendChild(ring);
                    }

                    const label = document.createElement("div");
                    label.className = "planet-label";
                    label.textContent = p.viet;

                    wrapper.appendChild(planet);
                    wrapper.appendChild(label);
                    orbit.appendChild(wrapper);

                    // CHỈ GẮN HOVER NẾU LÀ THIẾT BỊ DÙNG CHUỘT
                    if (!isTouch) {
                        wrapper.addEventListener("mouseenter", (e) =>
                            showTooltip(e, p),
                        );
                        wrapper.addEventListener("mousemove", (e) =>
                            moveTooltip(e),
                        );
                        wrapper.addEventListener("mouseleave", hideTooltip);
                    }

                    // SỰ KIỆN CLICK / TOUCH
                    wrapper.addEventListener("click", (e) => {
                        e.stopPropagation();
                        const clientX =
                            e.clientX ||
                            (e.touches && e.touches[0].clientX) ||
                            window.innerWidth / 2;
                        const clientY =
                            e.clientY ||
                            (e.touches && e.touches[0].clientY) ||
                            window.innerHeight / 2;
                        spawnParticles(clientX, clientY, p.color);
                        showModal(p);
                    });
                });
            }

            // Xử lý resize hoặc xoay màn hình (Orientation Change)
            window.addEventListener("resize", () => {
                resizeCanvas();
                buildStars();
                renderSolarSystem();
            });

            // Khởi tạo lần đầu
            resizeCanvas();
            buildStars();
            drawStars();
            renderSolarSystem();

            // Sun click
            document.getElementById("sun").addEventListener("click", (e) => {
                spawnParticles(e.clientX, e.clientY, "#ffcc00");
                showModal({
                    name: "MẶT TRỜI",
                    viet: "Mặt Trời",
                    emoji: "☀️",
                    fact: "Chiếm 99.86% tổng khối lượng hệ mặt trời, nhiệt độ bề mặt đạt 5.500°C.",
                    troll: "Bạn vừa nhìn thẳng vào Mặt Trời kỹ thuật số. NASA xác nhận: đây là hành động thứ 2 ngốc nhất trong vũ trụ, chỉ sau việc nhìn thẳng vào Mặt Trời thật. 🌞🕶️",
                    iq: "[ IQ ĐO ĐƯỢC: bị thiêu rụi ]",
                });
            });

            // ─── TOOLTIP LOGIC ───
            const tooltip = document.getElementById("tooltip");
            const ttTitle = document.getElementById("tt-title");
            const ttFact = document.getElementById("tt-fact");
            const ttTroll = document.getElementById("tt-troll");

            function showTooltip(e, p) {
                ttTitle.textContent = p.viet;
                ttFact.textContent = p.fact;
                ttTroll.textContent = p.hoverTroll || "";
                moveTooltip(e);
                tooltip.classList.add("show");
            }
            function moveTooltip(e) {
                let x = e.clientX + 16,
                    y = e.clientY - 10;
                if (x + 310 > window.innerWidth) x = e.clientX - 310;
                if (y + 140 > window.innerHeight) y = e.clientY - 140;
                tooltip.style.left = x + "px";
                tooltip.style.top = y + "px";
            }
            function hideTooltip() {
                tooltip.classList.remove("show");
            }

            // ─── MODAL LOGIC (TÍCH HỢP LUÔN CÂU HOVERTROLL LÊN MOBILE) ───
            const overlay = document.getElementById("modal-overlay");
            const mIcon = document.getElementById("m-icon");
            const mName = document.getElementById("m-name");
            const mFact = document.getElementById("m-fact");
            const mTroll = document.getElementById("m-troll");
            const mIq = document.getElementById("m-iq");

            function showModal(p) {
                hideTooltip();
                mIcon.textContent = p.emoji;
                mName.textContent = p.viet;
                mFact.textContent = p.fact;
                // Nếu là mobile, đưa câu hoverTroll vào trước để không lãng phí nội dung
                mTroll.innerHTML =
                    isTouch && p.hoverTroll
                        ? `<div style="font-style:italic;margin-bottom:8px;color:#ffd700">"${p.hoverTroll}"</div>${p.troll}`
                        : p.troll;
                mIq.textContent = p.iq || "";
                overlay.classList.add("show");
            }

            document
                .getElementById("modal-close")
                .addEventListener("click", () => {
                    overlay.classList.remove("show");
                });
            overlay.addEventListener("click", (e) => {
                if (e.target === overlay) overlay.classList.remove("show");
            });

            // ─── HIỆU ỨNG HẠT VỠ ───
            function spawnParticles(cx, cy, color) {
                for (let i = 0; i < 14; i++) {
                    const p = document.createElement("div");
                    p.className = "particle";
                    const angle = (i / 14) * Math.PI * 2;
                    const dist = 30 + Math.random() * 50;
                    p.style.cssText = `
                        left:${cx}px; top:${cy}px;
                        background:${color};
                        box-shadow: 0 0 6px ${color};
                        --tx: ${Math.cos(angle) * dist}px;
                        --ty: ${Math.sin(angle) * dist}px;
                        animation-duration:${0.4 + Math.random() * 0.3}s;
                    `;
                    document.body.appendChild(p);
                    setTimeout(() => p.remove(), 700);
                }
            }

            // ─── COLOR HELPERS ───
            function lighten(hex) {
                const n = parseInt(hex.slice(1), 16);
                return `rgb(${Math.min(255, ((n >> 16) & 0xff) + 80)}, ${Math.min(255, ((n >> 8) & 0xff) + 80)}, ${Math.min(255, (n & 0xff) + 80)})`;
            }
            function darken(hex) {
                const n = parseInt(hex.slice(1), 16);
                return `rgb(${Math.max(0, ((n >> 16) & 0xff) - 60)}, ${Math.max(0, ((n >> 8) & 0xff) - 60)}, ${Math.max(0, (n & 0xff) - 60)})`;
            }
            // ─── TÍNH NĂNG PHÓNG TO / THU NHỎ (ZOOM) ───
            let currentScale = 1;
            const MIN_SCALE = 0.4;
            const MAX_SCALE = 2.5;

            function applyZoom(delta) {
                currentScale = Math.min(
                    MAX_SCALE,
                    Math.max(MIN_SCALE, currentScale + delta),
                );
                center.style.transform = `scale(${currentScale})`;
            }

            // 1. Phóng to thu nhỏ bằng con lăn chuột (PC)
            window.addEventListener(
                "wheel",
                (e) => {
                    // Không zoom nếu đang mở modal
                    if (overlay.classList.contains("show")) return;

                    e.preventDefault();
                    const delta = e.deltaY < 0 ? 0.08 : -0.08;
                    applyZoom(delta);
                },
                { passive: false },
            );

            // 2. Phóng to thu nhỏ bằng 2 ngón tay (Pinch to Zoom trên Điện thoại)
            let initialPinchDistance = null;

            window.addEventListener(
                "touchstart",
                (e) => {
                    if (e.touches.length === 2) {
                        // Tính khoảng cách ban đầu giữa 2 ngón
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        initialPinchDistance = Math.hypot(dx, dy);
                    }
                },
                { passive: true },
            );

            window.addEventListener(
                "touchmove",
                (e) => {
                    if (e.touches.length === 2 && initialPinchDistance) {
                        if (e.cancelable) e.preventDefault();
                        const dx = e.touches[0].clientX - e.touches[1].clientX;
                        const dy = e.touches[0].clientY - e.touches[1].clientY;
                        const newDistance = Math.hypot(dx, dy);

                        // Tính độ chênh lệch khoảng cách để zoom
                        const diff =
                            (newDistance - initialPinchDistance) * 0.006;
                        applyZoom(diff);
                        initialPinchDistance = newDistance;
                    }
                },
                { passive: false },
            );

            window.addEventListener("touchend", (e) => {
                if (e.touches.length < 2) {
                    initialPinchDistance = null;
                }
            });
        </script>
    </body>
</html>
